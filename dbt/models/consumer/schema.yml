version: 2

models:
  - name: app_pitcher_arsenal
    description: >
      Consumer-facing denormalization of pitcher_pitch_arsenal for the Supabase
      web app. Adds pitcher_name, pitch_type_name, pitch_family so the app can
      render arsenal rows without joining. Grain: (season, pitcher_id, pitch_type_code).
    columns:
      - name: pitcher_id
        tests: [not_null]
      - name: season
        tests: [not_null]
      - name: pitch_type_code
        tests: [not_null]
      - name: usage_pct
        tests: [not_null]

  - name: app_league_pitch_summary
    description: >
      League-wide pitch metrics rollup. Grain: (season, pitch_type_code).
      Averages are pitch-weighted (sums across fact_pitch, not averages of
      pitcher averages). Use this view to answer 'how does <pitcher>'s slider
      compare to the league?'-style questions.
    columns:
      - name: season
        tests: [not_null]
      - name: pitch_type_code
        tests: [not_null]
      - name: pct_of_league_mix
        tests: [not_null]
      - name: n_pitches
        tests: [not_null]
      - name: n_pitchers
        description: Distinct pitchers who threw this pitch type in this season
        tests: [not_null]

  - name: app_league_batting_summary
    description: >
      League-wide batting summary. Grain: (season). Aggregates fact_game_state
      across all batters in the league per season — PA-weighted, computed from
      summed counts. Regular-season games only (game_type = 'R'); post-season,
      spring training, and exhibition are excluded. Use this view as the
      league-average baseline batters are compared against. Note: wRC+ at this
      grain is normalized to ~100 by construction (calibration check, not
      analytic). int_player_stats_enriched and player_rolling_stats use the
      same wRC+ formula, so per-player and rolling-window wRC+ values are on
      the same scale as this baseline.
    columns:
      - name: season
        tests:
          - not_null
          - unique
      - name: n_batters
        description: >
          Distinct batters who qualified for the season aggregate — i.e. whose
          season-total PA was at or above mean(PA) - 0.5 * stddev(PA) across
          all batters in that season. Low-PA cameos are excluded.
        tests: [not_null]
      - name: bat_plate_appearances
        tests: [not_null]
      - name: bat_at_bats
        tests: [not_null]

  - name: app_player_rolling_stats
    description: >
      Consumer-facing denormalization of player_rolling_stats with player_name.
      Grain unchanged: (player_id, as_of_date, window_days). window_days in (7, 30).
    columns:
      - name: player_id
        tests: [not_null]
      - name: as_of_date
        tests: [not_null]
      - name: window_days
        tests:
          - not_null
          - accepted_values:
              values: [7, 30]

  - name: app_player_batting_percentiles
    description: >
      Per-batter percentile ranks vs. the league. Grain: (player_id, season).
      For each qualified batter (the same regular-season pool as
      app_league_batting_summary), shows the raw stat plus the percentile (0-100)
      at which it ranks among all qualified batters that season for batting
      average, OBP, SLG, OPS, strikeout rate, walk rate, BABIP, and wRC+. Higher
      percentile is always better — K% is ranked so the lowest strikeout rate
      earns the highest percentile. Adds player_name so the app can render
      without a join.
    columns:
      - name: player_id
        tests: [not_null]
      - name: season
        tests: [not_null]
      - name: bat_avg_pctl
        description: Percentile (0-100) of this batter's AVG among qualified batters that season.
      - name: bat_obp_pctl
        description: Percentile (0-100) of this batter's OBP.
      - name: bat_slg_pctl
        description: Percentile (0-100) of this batter's SLG.
      - name: bat_ops_pctl
        description: Percentile (0-100) of this batter's OPS.
      - name: bat_k_pct_pctl
        description: >
          Percentile (0-100) of this batter's strikeout rate, inverted so the
          lowest K% ranks highest (higher percentile = fewer strikeouts).
      - name: bat_bb_pct_pctl
        description: Percentile (0-100) of this batter's walk rate (higher BB% ranks higher).
      - name: bat_babip_pctl
        description: Percentile (0-100) of this batter's BABIP.
      - name: bat_wrc_plus_pctl
        description: Percentile (0-100) of this batter's wRC+.

  - name: app_player_predictions
    description: >
      Consumer-facing denormalization of the predictions table with player_name.
      Grain unchanged: (game_pk, player_id, model_type).
    columns:
      - name: game_pk
        tests: [not_null]
      - name: player_id
        tests: [not_null]
      - name: model_type
        tests: [not_null]
      - name: as_of_date
        tests: [not_null]

  - name: app_search_entities
    description: >
      Unified consumer-facing search index of all current-season-active players
      and teams, one polymorphic row per entity. Powers the web app's
      player/team search box via a pg_trgm trigram index (built on display_name
      and search_text in the Supabase offload). "Active" = appeared in a game in
      the latest season in dim_game. Grain: (entity_type, uid). team_abbreviation
      comes from the team_abbreviation seed via dim_team.
    columns:
      - name: entity_type
        description: "'player' | 'team' discriminator."
        tests:
          - not_null
          - accepted_values:
              values: ['player', 'team']
      - name: uid
        description: MLB player_id (players) or team_id (teams). Unique within an entity_type.
        tests: [not_null]
      - name: display_name
        description: Player full name or team name — the primary search/display field.
        tests: [not_null]
      - name: position_name
        description: Player's most-recent-game position this season; null for teams.
      - name: team_id
        description: Player's current team_id; for a team row, its own team_id.
      - name: team_name
        description: Player's current team name; for a team row, its own name.
      - name: team_abbreviation
        description: Team abbreviation (e.g. 'NYY') from the team_abbreviation seed; secondary search token.
      - name: search_text
        description: Lowercased blob of display_name + team tokens; the pg_trgm GIN index target.
        tests: [not_null]
