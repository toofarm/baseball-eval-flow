version: 2

seeds:
  - name: team_abbreviation
    description: >
      Static lookup of MLB team_id → abbreviation (and team_name for
      readability), keyed on MLB Stats API team IDs. Joined into dim_team to
      populate the abbreviation column without a daily /teams API call.
      Abbreviations match the values the MLB Stats API returns (e.g. AZ, ATH).
    columns:
      - name: team_id
        description: MLB Stats API team ID (primary key).
        tests:
          - not_null
          - unique
      - name: abbreviation
        description: Team abbreviation (e.g. 'NYY').
        tests:
          - not_null
